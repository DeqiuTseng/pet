<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="灵宠 PocketPet：零门槛虚拟宠物陪伴 App，即将上线。给它取个名字，全屏互动，本地动画，无需登录。">
  <meta name="robots" content="index,follow">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="PocketPet">
  <meta property="og:title" content="灵宠 PocketPet - 即将上线">
  <meta property="og:description" content="一只小狗正在等你。口袋里的虚拟宠物陪伴，即将登陆 iOS 与 Android。">
  <meta property="og:url" content="https://deqiutseng.github.io/pet/">
  <meta property="og:image" content="https://deqiutseng.github.io/pet/assets/images/logo.png">
  <meta name="twitter:card" content="summary">
  <meta name="twitter:title" content="灵宠 PocketPet - 即将上线">
  <meta name="twitter:description" content="一只小狗正在等你。口袋里的虚拟宠物陪伴，即将登陆 iOS 与 Android。">
  <meta name="twitter:image" content="https://deqiutseng.github.io/pet/assets/images/logo.png">
  <title>灵宠 PocketPet - 即将上线</title>
  <link rel="icon" href="assets/images/logo.png" type="image/png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-deep: #1a1412;
      --bg-mid: #2a211e;
      --glow: #f07c5a;
      --glow-soft: rgba(240, 124, 90, 0.18);
      --glow-ring: rgba(240, 124, 90, 0.35);
      --text: #f5ebe4;
      --text-muted: #a8958c;
      --surface: rgba(255, 248, 242, 0.06);
      --line: rgba(255, 248, 242, 0.1);
      --radius: 20px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      min-height: 100%;
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
        "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      color: var(--text);
      background: var(--bg-deep);
      line-height: 1.65;
      overflow-x: hidden;
    }

    h1,
    h2,
    .brand span,
    .status-badge {
      font-family: "Fraunces", Georgia, "Times New Roman", serif;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    .page {
      position: relative;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background:
        radial-gradient(ellipse 80% 60% at 50% -10%, var(--glow-soft) 0%, transparent 55%),
        radial-gradient(ellipse 50% 40% at 90% 80%, rgba(240, 124, 90, 0.08) 0%, transparent 50%),
        radial-gradient(ellipse 40% 35% at 5% 70%, rgba(240, 124, 90, 0.06) 0%, transparent 50%),
        linear-gradient(180deg, var(--bg-deep) 0%, var(--bg-mid) 100%);
    }

    .orb {
      position: absolute;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(60px);
      opacity: 0.5;
    }

    .orb-1 {
      width: 320px;
      height: 320px;
      background: rgba(240, 124, 90, 0.15);
      top: -80px;
      right: -60px;
      animation: drift 12s ease-in-out infinite;
    }

    .orb-2 {
      width: 240px;
      height: 240px;
      background: rgba(240, 180, 140, 0.1);
      bottom: 10%;
      left: -80px;
      animation: drift 16s ease-in-out infinite reverse;
    }

    @keyframes drift {
      0%, 100% { transform: translate(0, 0); }
      50% { transform: translate(20px, -16px); }
    }

    .topbar {
      position: relative;
      z-index: 10;
      padding: 20px 0;
    }

    .container {
      width: min(680px, 90vw);
      margin: 0 auto;
    }

    .topbar-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 17px;
    }

    .logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      object-fit: cover;
      display: block;
      box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0, 0, 0, 0.3);
    }

    .lang-switch {
      display: inline-flex;
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow: hidden;
      background: var(--surface);
      backdrop-filter: blur(8px);
    }

    .lang-btn {
      border: 0;
      background: transparent;
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      color: var(--text-muted);
    }

    .lang-btn.active {
      background: rgba(240, 124, 90, 0.2);
      color: #ffc9b5;
      font-weight: 600;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px 0 48px;
      position: relative;
      z-index: 5;
    }

    .hero {
      text-align: center;
    }

    .pet-wrap {
      position: relative;
      width: min(220px, 52vw);
      margin: 0 auto 28px;
    }

    .pet-glow {
      position: absolute;
      inset: -20%;
      border-radius: 50%;
      background: radial-gradient(circle, var(--glow-ring) 0%, transparent 70%);
      animation: pulse 3s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 0.6; transform: scale(1); }
      50% { opacity: 1; transform: scale(1.05); }
    }

    .pet-img {
      position: relative;
      width: 100%;
      aspect-ratio: 1;
      object-fit: cover;
      border-radius: 50%;
      border: 2px solid var(--line);
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.4);
    }

    .paw-float {
      position: absolute;
      width: 44px;
      opacity: 0.7;
      filter: drop-shadow(0 4px 12px rgba(0, 0, 0, 0.3));
    }

    .paw-1 {
      top: 8%;
      right: -12%;
      animation: bob 4s ease-in-out infinite;
    }

    .paw-2 {
      bottom: 12%;
      left: -14%;
      animation: bob 5s ease-in-out infinite 0.5s;
      transform: rotate(-20deg);
    }

    @keyframes bob {
      0%, 100% { transform: translateY(0) rotate(var(--rot, 0deg)); }
      50% { transform: translateY(-8px) rotate(var(--rot, 0deg)); }
    }

    .paw-2 { --rot: -20deg; }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      border: 1px solid rgba(240, 124, 90, 0.4);
      border-radius: 999px;
      padding: 7px 16px;
      font-size: 13px;
      color: #ffc9b5;
      background: rgba(240, 124, 90, 0.12);
      margin-bottom: 20px;
      letter-spacing: 0.02em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--glow);
      box-shadow: 0 0 8px var(--glow);
      animation: blink 2s ease-in-out infinite;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    h1 {
      margin: 0 0 16px;
      font-size: clamp(30px, 6vw, 44px);
      line-height: 1.2;
      letter-spacing: -0.02em;
    }

    .lead {
      margin: 0 auto 32px;
      color: var(--text-muted);
      font-size: clamp(15px, 2.5vw, 17px);
      max-width: 42ch;
    }

    .teasers {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      margin-bottom: 36px;
    }

    .teaser {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: var(--surface);
      font-size: 13px;
      color: var(--text-muted);
      backdrop-filter: blur(6px);
    }

    .teaser span {
      font-size: 15px;
    }

    .cta-block {
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 24px;
      backdrop-filter: blur(12px);
      margin-bottom: 28px;
    }

    .cta-label {
      margin: 0 0 14px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .cta-row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      border-radius: 14px;
      padding: 13px 22px;
      font-weight: 600;
      font-size: 15px;
      transition: transform 0.18s ease, background 0.18s ease, box-shadow 0.18s ease;
      border: 1px solid transparent;
      cursor: pointer;
    }

    .btn:focus-visible {
      outline: 3px solid var(--glow-ring);
      outline-offset: 2px;
    }

    .btn-primary {
      background: var(--glow);
      color: #fff;
      box-shadow: 0 8px 28px rgba(240, 124, 90, 0.35);
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 12px 32px rgba(240, 124, 90, 0.45);
    }

    .btn-ghost {
      background: transparent;
      border-color: var(--line);
      color: var(--text);
    }

    .btn-ghost:hover {
      background: rgba(255, 255, 255, 0.05);
    }

    .platforms {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
      color: var(--text-muted);
      font-size: 13px;
    }

    .platform {
      display: flex;
      align-items: center;
      gap: 6px;
      opacity: 0.7;
    }

    .platform svg {
      width: 18px;
      height: 18px;
      fill: currentColor;
    }

    .links-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 6px 18px;
      font-size: 14px;
      color: var(--text-muted);
    }

    .links-row a:hover {
      color: var(--text);
    }

    footer {
      position: relative;
      z-index: 10;
      padding: 20px 0 28px;
      text-align: center;
      font-size: 13px;
      color: var(--text-muted);
      border-top: 1px solid var(--line);
    }

    footer a:hover {
      color: var(--text);
    }

    @media (max-width: 480px) {
      .cta-row {
        flex-direction: column;
      }

      .btn {
        width: 100%;
      }

      .platforms {
        flex-direction: column;
        align-items: center;
        gap: 8px;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="orb orb-1" aria-hidden="true"></div>
    <div class="orb orb-2" aria-hidden="true"></div>

    <header class="topbar">
      <div class="container topbar-inner">
        <a class="brand" href="#top" aria-label="PocketPet 首页" data-i18n-aria="brand.aria">
          <img class="logo" src="assets/images/logo.png" alt="PocketPet logo">
          <span data-i18n="brand.name">灵宠</span>
        </a>
        <div class="lang-switch" role="group" aria-label="Language Switch">
          <button id="lang-zh" class="lang-btn" type="button">中文</button>
          <button id="lang-en" class="lang-btn" type="button">EN</button>
        </div>
      </div>
    </header>

    <main id="top">
      <div class="container hero">
        <div class="pet-wrap">
          <div class="pet-glow" aria-hidden="true"></div>
          <img class="pet-img" src="assets/images/pet-hero.png" alt="灵宠小狗" data-i18n-alt="hero.petAlt">
          <img class="paw-float paw-1" src="assets/images/paw-full.png" alt="" aria-hidden="true">
          <img class="paw-float paw-2" src="assets/images/paw-full.png" alt="" aria-hidden="true">
        </div>

        <div class="status-badge">
          <span class="status-dot" aria-hidden="true"></span>
          <span data-i18n="hero.status">即将上线</span>
        </div>

        <h1 data-i18n-html="hero.title">一只小狗，<br>正在赶来</h1>
        <p class="lead" data-i18n="hero.lead">
          灵宠 PocketPet 是一款零门槛虚拟宠物陪伴 App。无需注册，取名即陪伴，全屏本地动画，轻触爪垫即可互动。我们正在打磨最后细节，很快与你见面。
        </p>

        <div class="teasers">
          <span class="teaser"><span>🚪</span> <span data-i18n="teaser.t1">无需登录</span></span>
          <span class="teaser"><span>🎬</span> <span data-i18n="teaser.t2">全屏动画</span></span>
          <span class="teaser"><span>🐾</span> <span data-i18n="teaser.t3">爪垫互动</span></span>
          <span class="teaser"><span>📴</span> <span data-i18n="teaser.t4">离线可用</span></span>
        </div>

        <div class="cta-block">
          <p class="cta-label" data-i18n="cta.label">想第一时间体验？欢迎联系我们</p>
          <div class="cta-row">
            <a class="btn btn-primary" href="mailto:deqiutseng@gmail.com" data-i18n="cta.contact">联系开发者</a>
            <a class="btn btn-ghost" href="privacy.html" data-i18n="cta.privacy">隐私政策</a>
          </div>
          <div class="platforms">
            <span class="platform">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.71 19.5c-.83 1.24-1.71 2.45-3.05 2.47-1.34.03-1.77-.79-3.29-.79-1.53 0-2 .77-3.27.82-1.31.05-2.3-1.32-3.14-2.53C4.25 17 2.94 12.45 4.7 9.39c.87-1.52 2.43-2.48 4.12-2.51 1.28-.02 2.5.87 3.29.87.78 0 2.26-1.07 3.8-.91.65.03 2.47.26 3.64 1.98-.09.06-2.17 1.28-2.15 3.81.03 3.02 2.65 4.03 2.68 4.04-.03.07-.42 1.44-1.38 2.83M13 3.5c.73-.83 1.94-1.46 2.94-1.5.13 1.17-.34 2.35-1.04 3.19-.69.85-1.83 1.51-2.95 1.42-.15-1.15.41-2.35 1.05-3.11z"/></svg>
              <span data-i18n="platform.ios">iOS 筹备中</span>
            </span>
            <span class="platform">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M17.6 9.48l1.84-3.18c.16-.31.04-.69-.26-.85-.29-.15-.65-.06-.83.22l-1.88 3.24a11.5 11.5 0 0 0-8.94 0L5.65 5.67c-.19-.28-.55-.37-.84-.22-.3.16-.42.54-.26.85l1.84 3.18C3.92 11.03 2 14.22 2 18h20c0-3.78-1.92-6.97-4.4-8.52zM7 15.25a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5zm10 0a1.25 1.25 0 1 1 0-2.5 1.25 1.25 0 0 1 0 2.5z"/></svg>
              <span data-i18n="platform.android">Android 筹备中</span>
            </span>
          </div>
        </div>

        <nav class="links-row" aria-label="相关链接">
          <a href="mailto:deqiutseng@gmail.com">deqiutseng@gmail.com</a>
          <a href="privacy.html" data-i18n="footer.privacy">用户隐私</a>
          <a href="sdklist.html" data-i18n="footer.sdk">第三方 SDK 列表</a>
        </nav>
      </div>
    </main>

    <footer>
      <div class="container">
        <strong data-i18n="brand.name">灵宠</strong> PocketPet ·
        <span data-i18n="footer.tagline">口袋里的虚拟宠物陪伴</span> ·
        <span data-i18n="footer.rights">© 2026</span>
      </div>
    </footer>
  </div>

  <script>
    (function () {
      var i18n = {
        zh: {
          "site.title": "灵宠 PocketPet - 即将上线",
          "site.description": "灵宠 PocketPet：零门槛虚拟宠物陪伴 App，即将上线。给它取个名字，全屏互动，本地动画，无需登录。",
          "brand.name": "灵宠",
          "brand.aria": "灵宠首页",
          "hero.status": "即将上线",
          "hero.title": "一只小狗，<br>正在赶来",
          "hero.lead": "灵宠 PocketPet 是一款零门槛虚拟宠物陪伴 App。无需注册，取名即陪伴，全屏本地动画，轻触爪垫即可互动。我们正在打磨最后细节，很快与你见面。",
          "hero.petAlt": "灵宠小狗",
          "teaser.t1": "无需登录",
          "teaser.t2": "全屏动画",
          "teaser.t3": "爪垫互动",
          "teaser.t4": "离线可用",
          "cta.label": "想第一时间体验？欢迎联系我们",
          "cta.contact": "联系开发者",
          "cta.privacy": "隐私政策",
          "platform.ios": "iOS 筹备中",
          "platform.android": "Android 筹备中",
          "footer.tagline": "口袋里的虚拟宠物陪伴",
          "footer.privacy": "用户隐私",
          "footer.sdk": "第三方 SDK 列表",
          "footer.rights": "© 2026"
        },
        en: {
          "site.title": "PocketPet - Coming Soon",
          "site.description": "PocketPet: a zero-friction virtual pet companion app, coming soon. Name your pet, enjoy full-screen local animations, no sign-in required.",
          "brand.name": "PocketPet",
          "brand.aria": "PocketPet Home",
          "hero.status": "Coming Soon",
          "hero.title": "A puppy is<br>on its way",
          "hero.lead": "PocketPet is a zero-friction virtual pet companion. No sign-up, name your pet and start bonding with full-screen local animations and paw-pad interactions. We're polishing the final details—see you soon.",
          "hero.petAlt": "PocketPet puppy",
          "teaser.t1": "No sign-in",
          "teaser.t2": "Full-screen",
          "teaser.t3": "Paw interactions",
          "teaser.t4": "Works offline",
          "cta.label": "Want early access? Get in touch",
          "cta.contact": "Contact developer",
          "cta.privacy": "Privacy Policy",
          "platform.ios": "iOS in progress",
          "platform.android": "Android in progress",
          "footer.tagline": "Your pocket virtual companion",
          "footer.privacy": "Privacy Policy",
          "footer.sdk": "Third-Party SDK List",
          "footer.rights": "© 2026"
        }
      };

      var langKey = "pocketpet_lang";

      function detectChinaRegion() {
        var locales = Array.isArray(navigator.languages) && navigator.languages.length
          ? navigator.languages
          : [navigator.language || ""];
        var hasCN = locales.some(function (loc) {
          return /-CN$/i.test(loc) || loc === "zh-CN" || loc === "zh";
        });
        if (hasCN) return true;
        try {
          var tz = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
          return ["Asia/Shanghai", "Asia/Chongqing", "Asia/Harbin", "Asia/Urumqi"].indexOf(tz) >= 0;
        } catch (e) {
          return false;
        }
      }

      function applyLang(lang) {
        var dict = i18n[lang] || i18n.en;
        document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
        document.title = dict["site.title"];
        var desc = document.querySelector('meta[name="description"]');
        if (desc) desc.setAttribute("content", dict["site.description"]);
        ["og:title", "og:description"].forEach(function (prop) {
          var el = document.querySelector('meta[property="' + prop + '"]');
          if (el) el.setAttribute("content", dict[prop === "og:title" ? "site.title" : "site.description"]);
        });
        ["twitter:title", "twitter:description"].forEach(function (name) {
          var el = document.querySelector('meta[name="' + name + '"]');
          if (el) el.setAttribute("content", dict[name === "twitter:title" ? "site.title" : "site.description"]);
        });

        document.querySelectorAll("[data-i18n]").forEach(function (el) {
          var key = el.getAttribute("data-i18n");
          if (dict[key]) el.textContent = dict[key];
        });
        document.querySelectorAll("[data-i18n-html]").forEach(function (el) {
          var key = el.getAttribute("data-i18n-html");
          if (dict[key]) el.innerHTML = dict[key];
        });
        document.querySelectorAll("[data-i18n-aria]").forEach(function (el) {
          var key = el.getAttribute("data-i18n-aria");
          if (dict[key]) el.setAttribute("aria-label", dict[key]);
        });
        document.querySelectorAll("[data-i18n-alt]").forEach(function (el) {
          var key = el.getAttribute("data-i18n-alt");
          if (dict[key]) el.setAttribute("alt", dict[key]);
        });

        var zhBtn = document.getElementById("lang-zh");
        var enBtn = document.getElementById("lang-en");
        if (zhBtn && enBtn) {
          zhBtn.classList.toggle("active", lang === "zh");
          enBtn.classList.toggle("active", lang === "en");
        }
      }

      function initLang() {
        var saved = localStorage.getItem(langKey);
        var initial = saved === "zh" || saved === "en" ? saved : (detectChinaRegion() ? "zh" : "en");
        applyLang(initial);
      }

      document.getElementById("lang-zh").addEventListener("click", function () {
        localStorage.setItem(langKey, "zh");
        applyLang("zh");
      });
      document.getElementById("lang-en").addEventListener("click", function () {
        localStorage.setItem(langKey, "en");
        applyLang("en");
      });

      initLang();
    })();
  </script>
</body>
</html>
